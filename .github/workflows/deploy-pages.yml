name: Build and deploy Gitaverse

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium for browser regression
        run: npx playwright install --with-deps chromium

      - name: Generate build identifier
        shell: bash
        run: echo "GITAVERSE_BUILD_ID=$(TZ=Asia/Kolkata date +'%d%b%Y-%H%M%S')" >> "$GITHUB_ENV"

      - name: Load persistent version history
        shell: bash
        run: |
          git fetch origin deployment-history || true
          if git show origin/deployment-history:version-history.json > "$RUNNER_TEMP/version-history.json" 2>/dev/null; then
            echo "Loaded deployment history"
          else
            cp version-history.json "$RUNNER_TEMP/version-history.json"
          fi
          echo "VERSION_HISTORY_FILE=$RUNNER_TEMP/version-history.json" >> "$GITHUB_ENV"
          echo "GITAVERSE_CHANGE_MESSAGE=$(git log -1 --pretty=%s)" >> "$GITHUB_ENV"

      - name: Build and validate deployment
        run: node scripts/build-deployment.mjs
        env:
          CLARITY_PROJECT_ID: ${{ vars.CLARITY_PROJECT_ID }}

      - name: Run player browser regression
        run: npm run test:browser

      - name: Run Rachana browser regression
        run: npm run test:docs-browser

      - name: Persist version history
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          history_dir="$RUNNER_TEMP/deployment-history"
          if git show-ref --verify --quiet refs/remotes/origin/deployment-history; then
            git worktree add -B deployment-history "$history_dir" origin/deployment-history
          else
            git worktree add -b deployment-history "$history_dir" HEAD
          fi
          cp dist/data/version-history.json "$history_dir/version-history.json"
          git -C "$history_dir" config user.name "github-actions[bot]"
          git -C "$history_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$history_dir" add version-history.json
          git -C "$history_dir" commit -m "Record Gitaverse $GITAVERSE_BUILD_ID"
          git -C "$history_dir" push origin deployment-history

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
